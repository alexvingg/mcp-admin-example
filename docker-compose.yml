services:
  db:
    image: postgres:16-alpine
    container_name: auth0demo-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admindb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admindb"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin-api:
    build:
      context: ./apps/admin-api
      dockerfile: Dockerfile
    container_name: auth0demo-api
    ports:
      - "3001:3001"
    env_file:
      - ./apps/admin-api/.env
    environment:
      # Override DATABASE_URL to use the docker network hostname (overrides .env if needed)
      DATABASE_URL: postgresql://admin:admin@db:5432/admindb?schema=public
    volumes:
      - ./apps/admin-api:/app
      - /app/node_modules
    command: sh -c "npx prisma db push --accept-data-loss && npm run db:seed && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    container_name: auth0demo-web
    ports:
      - "5173:5173"
    env_file:
      - ./apps/admin-web/.env
    volumes:
      - ./apps/admin-web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - admin-api

volumes:
  pg-data:
